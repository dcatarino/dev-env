# Herdr client settings for the client `herd` opens in a Codespace terminal
# (passed as HERDR_CONFIG_PATH). The server and a plain `herdr` keep using
# ~/.config/herdr/config.toml.
#
# Hide the sidebar and the tab row so the agent fills the terminal like a plain
# claude or codex session. ctrl+b b shows the sidebar.

onboarding = false

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true
